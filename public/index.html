<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>圆圆数学 · 你的 AI 数学小老师</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" crossorigin="anonymous" />
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js" crossorigin="anonymous"></script>
<style>
  :root{
    --bg:#fff7ee; --card:#ffffff; --ink:#3a2f2a; --muted:#8a7d74;
    --brand:#ff8a5b; --brand2:#6c8cff; --good:#3fbf7f; --bad:#ff6b6b;
    --line:#f0e4d8; --soft:#fff1e4; --shadow:0 10px 30px rgba(90,60,40,.12);
    --r:22px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,-apple-system,sans-serif;
    background:radial-gradient(1200px 600px at 80% -10%,#ffe6d2 0%,transparent 60%),
               radial-gradient(900px 500px at -10% 10%,#dce6ff 0%,transparent 55%),
               var(--bg);
    color:var(--ink); min-height:100vh; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:820px;margin:0 auto;padding:18px 16px 60px}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 2px 14px}
  .logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:22px;letter-spacing:.5px}
  .logo .pi{
    width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#fff;font-size:22px;
    background:linear-gradient(135deg,var(--brand),#ffb27a);box-shadow:var(--shadow);transform:rotate(-4deg)
  }
  .logo small{display:block;font-size:11px;font-weight:600;color:var(--muted);letter-spacing:0}
  .iconbtn{border:none;background:var(--card);width:42px;height:42px;border-radius:14px;cursor:pointer;
    box-shadow:var(--shadow);font-size:20px;display:grid;place-items:center;color:var(--ink)}
  .iconbtn:active{transform:scale(.94)}
  .card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:20px;border:2px solid #fff}
  .hidden{display:none!important}

  .hi{font-size:20px;font-weight:800;margin:0 0 4px}
  .hi .name{color:var(--brand)}
  .sub{color:var(--muted);font-size:14px;margin:0 0 14px}
  textarea{width:100%;min-height:92px;resize:vertical;border:2px solid var(--line);border-radius:16px;
    padding:14px 16px;font-size:17px;font-family:inherit;color:var(--ink);background:var(--soft);outline:none}
  textarea:focus{border-color:var(--brand)}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .chip{border:2px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-size:14px;
    cursor:pointer;color:var(--ink);transition:.15s}
  .chip:hover{border-color:var(--brand);background:var(--soft)}
  .btn{border:none;border-radius:16px;padding:14px 20px;font-size:17px;font-weight:800;cursor:pointer;color:#fff;
    background:linear-gradient(135deg,var(--brand),#ff9f6a);box-shadow:0 8px 20px rgba(255,138,91,.35)}
  .btn:active{transform:translateY(1px)}
  .btn.big{width:100%;padding:16px;font-size:19px}
  .btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:none}
  .btn.blue{background:linear-gradient(135deg,var(--brand2),#8aa4ff);box-shadow:0 8px 20px rgba(108,140,255,.35)}
  .filepill{display:inline-flex;align-items:center;gap:8px;background:var(--soft);border:2px solid var(--line);
    border-radius:14px;padding:8px 12px;font-size:14px;color:var(--ink);cursor:pointer}
  .previewimg{max-width:120px;max-height:100px;border-radius:12px;border:2px solid var(--line);margin-top:10px}
  .enginebadge{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);
    background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:4px 10px}
  .enginebadge b{color:var(--brand2)}

  .lessonTitle{font-size:20px;font-weight:800;margin:0}
  .dots{display:flex;gap:7px;margin:14px 0 4px;flex-wrap:wrap}
  .dot{width:11px;height:11px;border-radius:999px;background:var(--line);transition:.2s;cursor:pointer}
  .dot.on{background:var(--brand);transform:scale(1.25)}
  .dot.done{background:#ffceb3}
  .stage{margin-top:14px;min-height:220px;display:flex;flex-direction:column;gap:14px}
  .visualBox{background:var(--soft);border:2px dashed #ffd9bf;border-radius:18px;padding:14px;display:grid;place-items:center;min-height:120px}
  .visualBox svg{max-width:100%;height:auto}
  .cap{color:var(--muted);font-size:13px;text-align:center;margin-top:8px}
  .mathBox{text-align:center;font-size:22px;padding:6px 0}
  .sayBox{background:#fff;border:2px solid var(--line);border-radius:18px;padding:16px 18px;font-size:18px;line-height:1.7;position:relative}
  .sayBox.speaking{border-color:var(--brand);box-shadow:0 0 0 4px rgba(255,138,91,.12)}
  .teacher{position:absolute;top:-16px;left:16px;background:var(--brand);color:#fff;font-size:12px;font-weight:700;
    padding:4px 10px;border-radius:999px}
  .controls{display:flex;gap:10px;align-items:center;margin-top:16px}
  .controls .btn{flex:0 0 auto;padding:12px 16px;font-size:16px}
  .play{width:58px;height:58px;border-radius:999px;font-size:24px;padding:0;display:grid;place-items:center}
  .spacer{flex:1}

  .answerCard{margin-top:16px;border:2px solid var(--good);background:#effaf3;border-radius:18px;padding:16px}
  .answerCard .lab{font-size:12px;font-weight:800;color:var(--good);letter-spacing:1px}
  .answerCard .val{font-size:22px;font-weight:800;margin-top:4px}
  .answerCard .note{font-size:12px;color:var(--muted);margin-top:8px}

  .practice{margin-top:16px;border:2px solid var(--brand2);background:#eef2ff;border-radius:18px;padding:16px}
  .practice .lab{font-size:12px;font-weight:800;color:var(--brand2);letter-spacing:1px}
  .practice .q{font-size:17px;margin-top:6px;line-height:1.6}
  .practice .reveal{margin-top:12px}
  .practice .ans{margin-top:10px;font-weight:800;color:var(--brand2);display:none}

  .overlay{position:fixed;inset:0;background:rgba(255,247,238,.92);backdrop-filter:blur(4px);
    display:grid;place-items:center;z-index:50;text-align:center;padding:24px}
  .loadpi{font-size:64px;animation:bounce 1s infinite ease-in-out;display:inline-block}
  @keyframes bounce{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-18px) rotate(6deg)}}
  .loadmsg{margin-top:14px;font-size:18px;font-weight:700;color:var(--ink)}
  .loadsub{margin-top:6px;color:var(--muted);font-size:13px}

  .modal{position:fixed;inset:0;background:rgba(58,47,42,.35);display:grid;place-items:center;z-index:60;padding:18px}
  .modalCard{background:var(--card);border-radius:24px;box-shadow:var(--shadow);padding:22px;max-width:460px;width:100%;max-height:90vh;overflow:auto}
  .modalCard h3{margin:0 0 4px;font-size:20px}
  .field{margin-top:14px}
  .field label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:6px}
  .field input,.field select{width:100%;border:2px solid var(--line);border-radius:14px;padding:12px 14px;
    font-size:16px;font-family:inherit;background:var(--soft);outline:none;color:var(--ink)}
  .field input:focus,.field select:focus{border-color:var(--brand)}
  .help{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.5}
  .modalRow{display:flex;gap:10px;margin-top:20px}
  .err{background:#fff0f0;border:2px solid #ffd0d0;color:#c0392b;border-radius:14px;padding:12px 14px;font-size:14px;margin-top:14px}
  .engineList{display:flex;flex-direction:column;gap:8px;margin-top:6px}
  .engineOpt{display:flex;align-items:center;gap:10px;border:2px solid var(--line);border-radius:14px;padding:10px 12px;cursor:pointer;background:#fff}
  .engineOpt.on{border-color:var(--brand);background:var(--soft)}
  .engineOpt.off{opacity:.45;cursor:not-allowed}
  .engineOpt .nm{font-weight:800;font-size:15px}
  .engineOpt .nt{font-size:12px;color:var(--muted)}
  .engineOpt .tag{margin-left:auto;font-size:11px;border-radius:999px;padding:3px 8px;background:#eef2ff;color:var(--brand2);font-weight:700;white-space:nowrap}
  .engineOpt .tag.na{background:#f5f0ea;color:var(--muted)}
  .footer{text-align:center;color:var(--muted);font-size:12px;margin-top:26px;line-height:1.6}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">
      <div class="pi">π</div>
      <div>圆圆数学<small>你的 AI 数学小老师</small></div>
    </div>
    <button class="iconbtn" id="gear" title="设置">⚙️</button>
  </header>

  <!-- 输入区 -->
  <section class="card" id="inputCard">
    <h2 class="hi" id="greet">来，出道题给<span class="name" id="kidNameLabel">你</span>讲讲 👋</h2>
    <p class="sub">打字、或拍一张作业题的照片都行。我会一步一步、画着图讲给你听。</p>
    <textarea id="q" placeholder="比如：3/4 + 1/6 等于多少？　或者：一个长方形长 8 厘米、宽 5 厘米，面积是多少？"></textarea>

    <div class="row">
      <label class="filepill" for="photo">📷 拍照 / 传图</label>
      <input id="photo" type="file" accept="image/*" capture="environment" class="hidden" />
      <span id="fileName" class="help" style="margin:0"></span>
      <div class="spacer"></div>
      <span class="enginebadge" id="engineBadge">引擎：<b id="engineName">检测中…</b></span>
    </div>
    <div><img id="preview" class="previewimg hidden" alt="题目图片" /></div>

    <div class="chips" id="examples"></div>

    <div class="row" style="margin-top:16px">
      <button class="btn big" id="go">开始讲解 ✨</button>
    </div>
  </section>

  <!-- 讲解播放器 -->
  <section class="card hidden" id="playerCard">
    <div class="row" style="justify-content:space-between;margin:0">
      <h2 class="lessonTitle" id="lessonTitle">这道题</h2>
      <button class="btn ghost" id="newQ" style="padding:8px 14px;font-size:14px">← 再问一题</button>
    </div>
    <div class="dots" id="dots"></div>

    <div class="stage">
      <div class="visualBox hidden" id="visualBox"></div>
      <div class="mathBox hidden" id="mathBox"></div>
      <div class="sayBox" id="sayBox"><span class="teacher">圆圆老师</span><span id="sayText"></span></div>
    </div>

    <div class="controls">
      <button class="btn ghost" id="prev">‹ 上一步</button>
      <button class="btn play" id="playToggle" title="播放 / 暂停">▶</button>
      <button class="btn ghost" id="replay" title="重听这一步">↻</button>
      <div class="spacer"></div>
      <button class="btn ghost" id="next">下一步 ›</button>
    </div>

    <div class="answerCard hidden" id="answerCard">
      <div class="lab">最终答案</div>
      <div class="val" id="answerVal"></div>
      <div class="note">💡 给家长：答案已醒目显示，方便你顺手核对一下。数学讲解偶尔也会算错哦。</div>
    </div>

    <div class="practice hidden" id="practiceCard">
      <div class="lab">🎯 换你试试</div>
      <div class="q" id="practiceQ"></div>
      <div class="reveal">
        <button class="btn blue" id="showAns" style="padding:10px 16px;font-size:15px">看答案</button>
        <div class="ans" id="practiceAns"></div>
      </div>
    </div>
  </section>

  <div class="footer">
    在你家的电脑 / 树莓派上运行 · 不依赖任何第三方服务器<br/>
    讲解由 AI 生成，可能出错，重要作业请家长把把关。
  </div>
</div>

<!-- 加载中 -->
<div class="overlay hidden" id="loading">
  <div>
    <div class="loadpi">🧮</div>
    <div class="loadmsg" id="loadMsg">圆圆老师正在准备你的课…</div>
    <div class="loadsub" id="loadSub">正在想最好懂的讲法，稍等一下下</div>
  </div>
</div>

<!-- 设置 -->
<div class="modal hidden" id="settings">
  <div class="modalCard">
    <h3>设置</h3>
    <p class="help" style="margin-top:2px">保存在这台设备的浏览器里。</p>

    <div class="field hidden" id="codeField">
      <label>访问码</label>
      <input id="accessCode" type="password" placeholder="问爸爸妈妈要访问码" autocomplete="off" />
      <div class="help">家里服务器设置了访问码，输入一次就好。</div>
    </div>

    <div class="field">
      <label>AI 引擎</label>
      <div class="engineList" id="engineList"><div class="help">正在检测…</div></div>
      <div class="help">列表由家里的服务器自动检测。灰色的表示那台机器上没装。</div>
    </div>

    <div class="field">
      <label>孩子的名字（可选，讲解会更亲切）</label>
      <input id="kidName" type="text" placeholder="比如：朵朵" maxlength="12" />
    </div>

    <div class="field">
      <label>年级 / 难度</label>
      <select id="grade">
        <option value="小学四年级">小学四年级</option>
        <option value="小学五年级" selected>小学五年级</option>
        <option value="小学六年级">小学六年级</option>
      </select>
    </div>

    <div class="err hidden" id="settingsErr"></div>

    <div class="modalRow">
      <button class="btn ghost" id="closeSettings" style="flex:1">取消</button>
      <button class="btn" id="saveSettings" style="flex:1">保存</button>
    </div>
  </div>
</div>

<script>
"use strict";

/* ---------- 配置存取 ---------- */
const LS = "yuanyuan_math_v2";
const cfg = Object.assign({accessCode:"",kidName:"",grade:"小学五年级",provider:"auto"},
  JSON.parse(localStorage.getItem(LS) || "{}"));
function saveCfg(){ localStorage.setItem(LS, JSON.stringify(cfg)); }

const $ = id => document.getElementById(id);
const inputCard=$("inputCard"), playerCard=$("playerCard"), loading=$("loading"), settings=$("settings");

/* ---------- 服务器状态 ---------- */
let serverInfo = { authRequired:false, active:null, providers:[] };
function apiHeaders(){
  const h={ "content-type":"application/json" };
  if(cfg.accessCode) h["x-access-code"]=cfg.accessCode;
  return h;
}
async function fetchProviders(){
  try{
    const r=await fetch("/api/providers",{headers:apiHeaders()});
    if(r.status===401){ serverInfo.authRequired=true; updateEngineBadge(); openSettings("需要输入访问码才能使用。"); return; }
    serverInfo=await r.json();
    updateEngineBadge();
  }catch(e){
    $("engineName").textContent="服务器未连接";
  }
}
function providerLabel(id){
  const p=(serverInfo.providers||[]).find(p=>p.id===id);
  return p ? p.label : id;
}
function activeProvider(){
  if(cfg.provider && cfg.provider!=="auto"){
    const p=(serverInfo.providers||[]).find(p=>p.id===cfg.provider && p.available);
    if(p) return p.id;
  }
  return serverInfo.active;
}
function updateEngineBadge(){
  const a=activeProvider();
  $("engineName").textContent = a ? providerLabel(a) : (serverInfo.authRequired ? "待解锁" : "未检测到");
}

/* ---------- 例题 ---------- */
const EXAMPLES = [
  "3/4 + 1/6 等于多少？",
  "把 0.25 变成分数，怎么做？",
  "长方形长 8 厘米、宽 5 厘米，面积是多少？",
  "24 和 36 的最大公因数是几？",
  "小明有 15 颗糖，分给 3 个小朋友，每人几颗？",
  "为什么 1/2 比 1/3 大？"
];
function renderExamples(){
  $("examples").innerHTML = "";
  EXAMPLES.forEach(t=>{
    const c=document.createElement("div"); c.className="chip"; c.textContent=t;
    c.onclick=()=>{ $("q").value=t; };
    $("examples").appendChild(c);
  });
}

/* ---------- 语音（TTS，跑在孩子的设备上，免费） ---------- */
let zhVoice=null;
function pickVoice(){
  const vs = speechSynthesis.getVoices();
  const zh = vs.filter(v=>/^zh|Chinese|Mandarin/i.test(v.lang+v.name));
  const pref = zh.find(v=>/Xiaoxiao|Yunxi|Yunyang|Huihui|Mandarin|普通话/i.test(v.name));
  zhVoice = pref || zh[0] || null;
}
if("speechSynthesis" in window){
  pickVoice();
  speechSynthesis.onvoiceschanged = pickVoice;
}
function speak(text, onend){
  if(!("speechSynthesis" in window)){ if(onend) setTimeout(onend, 1200); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  if(zhVoice) u.voice=zhVoice;
  u.lang="zh-CN"; u.rate=0.92; u.pitch=1.05;
  u.onend=()=>{ if(onend) onend(); };
  u.onerror=()=>{ if(onend) onend(); };
  speechSynthesis.speak(u);
}
function stopSpeak(){ if("speechSynthesis" in window) speechSynthesis.cancel(); }

/* ---------- 可视化积木（永远画对） ---------- */
const COL={fill:"#ff8a5b",fill2:"#6c8cff",light:"#ffe0cc",line:"#c9b8a8",ink:"#3a2f2a"};
function svg(w,h,inner){return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}">${inner}</svg>`;}
function clampInt(n,lo,hi,def){ n=Math.round(Number(n)); if(!isFinite(n)) return def; return Math.max(lo,Math.min(hi,n)); }

function vFractionBar(nums){
  const parts=clampInt(nums&&nums[0],1,20,4), filled=clampInt(nums&&nums[1],0,parts,1);
  const W=460,H=90,pad=10,bw=(W-2*pad)/parts;
  let r="";
  for(let i=0;i<parts;i++){
    r+=`<rect x="${pad+i*bw}" y="20" width="${bw}" height="50" rx="6" fill="${i<filled?COL.fill:'#fff'}" stroke="${COL.line}" stroke-width="2"/>`;
  }
  r+=`<text x="${W/2}" y="14" text-anchor="middle" font-size="14" fill="${COL.ink}" font-weight="700">${filled} / ${parts}</text>`;
  return svg(W,H,r);
}
function vNumberLine(nums){
  let min=Number(nums&&nums[0]), max=Number(nums&&nums[1]);
  if(!isFinite(min)) min=0; if(!isFinite(max)) max=10; if(max<=min) max=min+10;
  const hi = (nums&&nums.length>2 && isFinite(Number(nums[2])))?Number(nums[2]):null;
  const W=460,H=80,pad=26,y=44;
  const span=max-min;
  let ticks = Math.min(20, Math.max(2, Math.round(span)));
  const stepv = span/ticks;
  const x = v => pad + (v-min)/span*(W-2*pad);
  let r=`<line x1="${pad}" y1="${y}" x2="${W-pad}" y2="${y}" stroke="${COL.line}" stroke-width="3"/>`;
  for(let i=0;i<=ticks;i++){
    const v=min+i*stepv, px=x(v);
    r+=`<line x1="${px}" y1="${y-6}" x2="${px}" y2="${y+6}" stroke="${COL.line}" stroke-width="2"/>`;
    const lab = Math.abs(v-Math.round(v))<1e-6 ? Math.round(v) : v.toFixed(1);
    r+=`<text x="${px}" y="${y+22}" text-anchor="middle" font-size="12" fill="${COL.ink}">${lab}</text>`;
  }
  if(hi!==null){
    const px=x(hi);
    r+=`<circle cx="${px}" cy="${y}" r="8" fill="${COL.fill}" stroke="#fff" stroke-width="2"/>`;
    r+=`<text x="${px}" y="${y-14}" text-anchor="middle" font-size="13" font-weight="700" fill="${COL.fill}">${hi}</text>`;
  }
  return svg(W,H,r);
}
function vAreaGrid(nums){
  const rows=clampInt(nums&&nums[0],1,12,3), cols=clampInt(nums&&nums[1],1,12,4);
  const sr=clampInt(nums&&nums[2],0,rows,rows), sc=clampInt(nums&&nums[3],0,cols,cols);
  const cell=Math.min(34, Math.floor(300/Math.max(rows,cols)));
  const W=cols*cell+40,H=rows*cell+40,ox=20,oy=20;
  let r="";
  for(let i=0;i<rows;i++)for(let j=0;j<cols;j++){
    const on=(i<sr&&j<sc);
    r+=`<rect x="${ox+j*cell}" y="${oy+i*cell}" width="${cell}" height="${cell}" fill="${on?COL.fill:'#fff'}" stroke="${COL.line}" stroke-width="1.5"/>`;
  }
  r+=`<text x="${ox+cols*cell/2}" y="${oy+rows*cell+16}" text-anchor="middle" font-size="13" fill="${COL.ink}">${cols} 列 × ${rows} 行</text>`;
  return svg(W,H,r);
}
function vBarModel(nums,labels){
  const vals=(nums||[]).map(Number).filter(n=>isFinite(n)&&n>=0).slice(0,6);
  if(vals.length===0) return "";
  const max=Math.max(...vals,1), W=460,pad=90,barH=26,gap=16;
  const H=vals.length*(barH+gap)+20;
  let r="";
  vals.forEach((v,i)=>{
    const y=14+i*(barH+gap), w=(W-pad-30)*(v/max);
    const lab=(labels&&labels[i])?String(labels[i]).slice(0,8):("第"+(i+1)+"项");
    r+=`<text x="8" y="${y+barH/2+5}" font-size="13" fill="${COL.ink}">${lab}</text>`;
    r+=`<rect x="${pad}" y="${y}" width="${Math.max(2,w)}" height="${barH}" rx="6" fill="${i%2?COL.fill2:COL.fill}"/>`;
    r+=`<text x="${pad+Math.max(2,w)+8}" y="${y+barH/2+5}" font-size="13" font-weight="700" fill="${COL.ink}">${v}</text>`;
  });
  return svg(W,H,r);
}
function renderVisual(v){
  if(!v||!v.type||v.type==="none") return "";
  const nums=v.nums||[], labels=v.labels||[];
  let s="";
  try{
    if(v.type==="fractionBar") s=vFractionBar(nums);
    else if(v.type==="numberLine") s=vNumberLine(nums);
    else if(v.type==="areaGrid") s=vAreaGrid(nums);
    else if(v.type==="barModel") s=vBarModel(nums,labels);
  }catch(e){ s=""; }
  if(!s) return "";
  if(v.caption) s+=`<div class="cap">${escapeHtml(v.caption)}</div>`;
  return s;
}
function escapeHtml(t){return String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

/* ---------- 调用家里的桥梁服务器 ---------- */
async function generateLesson(question, imageB64, mediaType){
  const resp = await fetch("/api/lesson", {
    method:"POST",
    headers: apiHeaders(),
    body: JSON.stringify({
      question, imageB64, mediaType,
      grade: cfg.grade, kidName: cfg.kidName,
      provider: cfg.provider
    })
  });
  const data = await resp.json().catch(()=>({}));
  if(resp.status===401){ serverInfo.authRequired=true; openSettings("访问码不对或还没填，输入后再试。"); throw new Error("需要访问码"); }
  if(!resp.ok) throw new Error(data.error || ("请求失败（"+resp.status+"）"));
  return data.lesson;
}

/* ---------- 播放器 ---------- */
let lesson=null, idx=0, playing=false;
function startLesson(l){
  lesson=l; idx=0; playing=false;
  inputCard.classList.add("hidden");
  playerCard.classList.remove("hidden");
  $("lessonTitle").textContent = l.title || "这道题";
  $("answerCard").classList.toggle("hidden", !l.isMath);
  $("practiceCard").classList.add("hidden");
  $("answerVal").textContent = l.answer || "";
  if(l.isMath && l.practice){
    $("practiceQ").textContent = l.practice.question || "";
    $("practiceAns").textContent = "答案：" + (l.practice.answer || "");
    $("practiceAns").style.display="none";
    $("showAns").style.display="";
  }
  buildDots();
  showStep(0);
  window.scrollTo({top:0,behavior:"smooth"});
  setTimeout(()=>{ playing=true; updatePlayBtn(); playCurrent(); }, 400);
}
function buildDots(){
  const d=$("dots"); d.innerHTML="";
  (lesson.steps||[]).forEach((_,i)=>{
    const el=document.createElement("div"); el.className="dot";
    el.onclick=()=>{ pause(); showStep(i); };
    d.appendChild(el);
  });
}
function markDots(){
  [...$("dots").children].forEach((el,i)=>{
    el.classList.toggle("on", i===idx);
    el.classList.toggle("done", i<idx);
  });
}
function showStep(i){
  const steps=lesson.steps||[];
  idx=Math.max(0,Math.min(steps.length-1,i));
  const s=steps[idx]||{};
  const vHtml=renderVisual(s.visual);
  const vb=$("visualBox");
  if(vHtml){ vb.innerHTML=vHtml; vb.classList.remove("hidden"); }
  else { vb.innerHTML=""; vb.classList.add("hidden"); }
  const mb=$("mathBox");
  if(s.math && s.math.trim() && window.katex){
    mb.classList.remove("hidden"); mb.innerHTML="";
    try{ katex.render(s.math, mb, {throwOnError:false, displayMode:true}); }
    catch(e){ mb.textContent=s.math; }
  } else { mb.classList.add("hidden"); mb.innerHTML=""; }
  $("sayText").textContent = s.say || "";
  markDots();
}
function playCurrent(){
  const s=(lesson.steps||[])[idx]; if(!s) return;
  $("sayBox").classList.add("speaking");
  speak(s.say||"", ()=>{
    $("sayBox").classList.remove("speaking");
    if(!playing) return;
    const last = idx>=(lesson.steps.length-1);
    if(last){ finishLesson(); }
    else { setTimeout(()=>{ if(playing){ showStep(idx+1); playCurrent(); } }, 650); }
  });
}
function finishLesson(){
  playing=false; updatePlayBtn();
  if(lesson.isMath){
    $("practiceCard").classList.remove("hidden");
    $("answerCard").scrollIntoView({behavior:"smooth",block:"center"});
  }
}
function pause(){ playing=false; stopSpeak(); $("sayBox").classList.remove("speaking"); updatePlayBtn(); }
function updatePlayBtn(){ $("playToggle").textContent = playing ? "⏸" : "▶"; }

$("playToggle").onclick=()=>{
  if(playing){ pause(); }
  else { playing=true; updatePlayBtn(); playCurrent(); }
};
$("next").onclick=()=>{ pause(); if(idx<lesson.steps.length-1) showStep(idx+1); else finishLesson(); };
$("prev").onclick=()=>{ pause(); if(idx>0) showStep(idx-1); };
$("replay").onclick=()=>{ pause(); playing=true; updatePlayBtn(); playCurrent(); };
$("newQ").onclick=()=>{
  pause(); lesson=null;
  playerCard.classList.add("hidden");
  inputCard.classList.remove("hidden");
  window.scrollTo({top:0,behavior:"smooth"});
};
$("showAns").onclick=()=>{ $("practiceAns").style.display="block"; $("showAns").style.display="none"; };

/* ---------- 输入处理 ---------- */
let pendingImage=null;
$("photo").onchange=(e)=>{
  const f=e.target.files&&e.target.files[0]; if(!f) return;
  if(f.size > 8*1024*1024){ alert("图片有点大（超过 8MB），换一张小一点的吧。"); return; }
  const reader=new FileReader();
  reader.onload=()=>{
    const dataUrl=reader.result;
    const m=/^data:(image\/[a-zA-Z0-9.+-]+);base64,(.*)$/.exec(dataUrl);
    if(!m){ alert("图片格式没读懂，换一张 JPG 或 PNG。"); return; }
    pendingImage={ b64:m[2], mediaType:m[1] };
    $("preview").src=dataUrl; $("preview").classList.remove("hidden");
    $("fileName").textContent = "已选图片，点「开始讲解」";
  };
  reader.readAsDataURL(f);
};

const LOAD_MSGS=[
  "圆圆老师正在准备你的课…",
  "在想最好懂的讲法…",
  "正在画小图…",
  "正在一步步验算…",
  "马上就好啦…"
];
let loadTimer=null;
function showLoading(){
  loading.classList.remove("hidden");
  const a=activeProvider();
  $("loadSub").textContent = (a==="ollama")
    ? "本地模型在认真思考，第一次会久一点（一两分钟很正常）"
    : "正在想最好懂的讲法，可能要等半分钟";
  let i=0; $("loadMsg").textContent=LOAD_MSGS[0];
  loadTimer=setInterval(()=>{ i=(i+1)%LOAD_MSGS.length; $("loadMsg").textContent=LOAD_MSGS[i]; }, 3000);
}
function hideLoading(){ loading.classList.add("hidden"); if(loadTimer) clearInterval(loadTimer); }

async function onGo(){
  const text=$("q").value.trim();
  if(!text && !pendingImage){ $("q").focus(); return; }
  showLoading();
  try{
    const l=await generateLesson(text, pendingImage&&pendingImage.b64, pendingImage&&pendingImage.mediaType);
    hideLoading();
    startLesson(l);
  }catch(err){
    hideLoading();
    if(err.message!=="需要访问码") alert(err.message || "出了点小问题，再试一次吧。");
  }
}
$("go").onclick=onGo;
$("q").addEventListener("keydown",(e)=>{ if(e.key==="Enter"&&(e.metaKey||e.ctrlKey)) onGo(); });

/* ---------- 设置弹窗 ---------- */
function renderEngineList(){
  const box=$("engineList"); box.innerHTML="";
  const mk=(id,label,note,available,tag)=>{
    const el=document.createElement("div");
    el.className="engineOpt"+(available?"":" off")+((cfg.provider===id)?" on":"");
    el.innerHTML=`<div><div class="nm">${label}</div><div class="nt">${note||""}</div></div>
      <span class="tag ${available?"":"na"}">${tag}</span>`;
    if(available) el.onclick=()=>{ cfg.provider=id; renderEngineList(); };
    box.appendChild(el);
  };
  mk("auto","自动选择","让服务器挑一个能用的",true, cfg.provider==="auto"?"当前":"可选");
  (serverInfo.providers||[]).forEach(p=>{
    mk(p.id, p.label, p.note + (p.model?(" · "+p.model):"") + (p.supportsImage?"":" · 不支持看图"),
       p.available, p.available ? (cfg.provider===p.id?"当前":"可用") : "未安装");
  });
}
function openSettings(errMsg){
  $("kidName").value=cfg.kidName||"";
  $("grade").value=cfg.grade||"小学五年级";
  $("accessCode").value=cfg.accessCode||"";
  $("codeField").classList.toggle("hidden", !serverInfo.authRequired);
  renderEngineList();
  const eb=$("settingsErr");
  if(errMsg){ eb.textContent=errMsg; eb.classList.remove("hidden"); } else { eb.classList.add("hidden"); }
  settings.classList.remove("hidden");
}
$("gear").onclick=()=>openSettings();
$("closeSettings").onclick=()=>settings.classList.add("hidden");
$("saveSettings").onclick=async ()=>{
  cfg.kidName=$("kidName").value.trim();
  cfg.grade=$("grade").value;
  cfg.accessCode=$("accessCode").value.trim();
  saveCfg();
  applyCfg();
  settings.classList.add("hidden");
  await fetchProviders();   // 用新访问码重新拉一次
  updateEngineBadge();
};
function applyCfg(){
  $("kidNameLabel").textContent = cfg.kidName ? cfg.kidName : "你";
}

/* ---------- 初始化 ---------- */
renderExamples();
applyCfg();
fetchProviders();
</script>
